<html lang="en">
<meta charset="utf-8">

* {box-sizing:border-box}
body {margin:0;background:var(--page);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main {max-width:1130px;margin:auto;padding:32px 20px}
h1 {margin:0;font-size:clamp(27px,5vw,42px);letter-spacing:-.04em;line-height:1.15}
.topbar {display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.theme-control {display:flex;align-items:center;gap:8px;color:var(--muted)}
input[type="checkbox"] {accent-color:var(--accent)}
.layout {display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:26px;align-items:start}
.board {position:relative;display:grid;grid-template-columns:repeat(8,1fr);border-radius:9px;overflow:hidden;user-select:none;-webkit-user-select:none}
button {font:inherit;cursor:pointer}
.square {position:relative;aspect-ratio:1;display:grid;place-items:center;padding:0;border:0;color:var(--board-ink);line-height:1}
.light {background:var(--light)}.dark {background:var(--dark)}
.square:hover {box-shadow:inset 0 0 0 3px var(--board-hover)}
.square:focus-visible {outline:3px solid var(--board-ink);outline-offset:-5px;z-index:1}
.piece {position:relative;font:clamp(20px,7vw,64px)/1 "DejaVu Sans","Segoe UI Symbol",sans-serif}
/* Right-click highlights sit under the piece; arrows are drawn in an overlay above. */
.square[data-hl]::before {content:"";position:absolute;inset:0;opacity:.8}
.square[data-hl="red"]::before {background:#eb6150}
.square[data-hl="green"]::before {background:#acce59}
.square[data-hl="orange"]::before {background:#ffaa00}
.square[data-hl="blue"]::before {background:#52b0dc}
.annotations {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.tip {margin:16px 0 0;font-size:13.5px}
.white-piece {color:#fff;-webkit-text-stroke:1.7px var(--white-edge);paint-order:stroke fill;text-shadow:0 1px 1px #0004}
.black-piece {color:var(--black-piece);text-shadow:0 1px 1px #fff8}
.coord {position:absolute;font:700 clamp(8px,1.6vw,12px)/1 system-ui;color:var(--board-ink);pointer-events:none}
.rank {top:4px;left:4px}.file {bottom:4px;right:4px}
.square.placed {background:var(--marked)}.square.target {box-shadow:inset 0 0 0 4px var(--target)}
.square.accepted {background:var(--accepted)}.square.rejected {background:var(--rejected)}
.square.reply {box-shadow:inset 0 0 0 4px var(--reply)}
.panel {background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:20px}
h2 {font-size:22px;margin:0 0 8px}
p {margin:0 0 14px}
/* Drawn piece sets are images that fill the square; "Original" keeps the font characters. */
.piece.art {display:grid;place-items:center;width:100%;height:100%}
.piece img {display:block;width:100%;height:100%;pointer-events:none}
#tray.art {display:inline-grid;width:38px;height:38px}
:root[data-theme="poodles"] .queen-piece img,
:root[data-theme="poodles"] #tray img {display:none}
.pickers {display:flex;flex-wrap:wrap;gap:14px}
#progress,.muted {color:var(--muted)}
#feedback {min-height:5.2em;padding:12px;background:var(--well);border-radius:7px}
#feedback.correct {color:var(--accent)}
.actions,.jump {display:flex;flex-wrap:wrap;gap:8px}
.jump {margin-top:17px}
.action,.jump button {border:1px solid var(--control-edge);background:var(--control);color:var(--ink);padding:7px 11px;border-radius:6px}
.action:hover,.jump button:hover {background:var(--control-hover)}
.action:disabled {cursor:default;opacity:.45}
.jump button[aria-current="step"] {outline:2px solid var(--accent);outline-offset:1px}
.jump button.done {background:var(--done)}
.primary {background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.primary:hover {background:var(--accent-hover)}
#review {margin:0 0 14px}
select {font:inherit;color:var(--ink);background:var(--control);border:1px solid var(--control-edge);border-radius:5px;padding:4px}
.history {margin-top:24px}
summary {cursor:pointer}
.history-run {margin-top:12px}
.history-table {overflow-x:auto}
table {border-collapse:collapse;width:100%;margin-top:8px;font-size:14px}
th,td {text-align:left;border-bottom:1px solid var(--edge);padding:6px 8px;white-space:nowrap}
.mode {margin-bottom:15px}
#section {display:block;width:100%;margin-top:4px}
#tray {display:inline-block;vertical-align:middle;margin-right:4px;font-size:31px}
:root[data-theme="poodles"] .queen-piece,
:root[data-theme="poodles"] #tray {font-size:0;position:relative}
:root[data-theme="poodles"] .queen-piece::before,
:root[data-theme="poodles"] #tray::before {
  content:"🐩";
  font:clamp(17px,5.7vw,54px)/1 "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  display:inline-block;
  filter:grayscale(1) brightness(1.24) drop-shadow(0 0 1px #2c2330);
}
:root[data-theme="poodles"] .queen-piece.black-piece::before,
:root[data-theme="poodles"] #tray.black-piece::before {
  filter:grayscale(1) brightness(.38) drop-shadow(0 0 1px #fff9ff);
}
:root[data-theme="poodles"] #tray::before {font-size:25px}
:root[data-theme="poodles"] .queen-piece.white-piece::before,
:root[data-theme="poodles"] #tray.white-piece::before {text-shadow:0 0 2px #111,0 1px 2px #111}
[hidden] {display:none!important}
@media(max-width:760px) {.layout {grid-template-columns:minmax(0,1fr);gap:14px} main {padding-top:18px}.panel {padding:15px}}
</style>

<header class="topbar">
<h1>Learning Chess: Step 2</h1>
<div class="pickers">
<label class="theme-control">Pieces
<select id="pieces">
<option value="merida">Merida</option>
<option value="staunty">Staunty</option>
<option value="original">Original</option>
</select>
</label>
<label class="theme-control">Theme
<select id="theme">
<option value="forest">Forest</option>
<option value="midnight">Midnight</option>

</label>
</div>
</header>
<div class="layout">

</select></label></p>
<p class="mode"><label><input type="checkbox" id="timed"> Timed mode</label></p>
<p id="progress"></p>
<h2><span id="tray" class="piece" aria-hidden="true"></span><span id="side"></span></h2>
<p id="instructions"></p>
<p id="workbookPage" class="muted"></p>
<p id="feedback" class="muted" role="status" aria-live="polite"></p>
<p id="review" hidden><label>Review a square <select id="reviewSquare"></select></label></p>
<div class="actions">
<button id="check" class="action primary" disabled>Check squares</button>
<button id="hint" class="action">Hint</button>
<button id="playLine" class="action" hidden>Show reply</button>
<button id="defense" class="action" hidden>Show defense</button>
<button id="retry" class="action">Try again</button>
<button id="answer" class="action">Show answers</button>
<button id="next" class="action">Next puzzle</button>
</div>
<nav id="jump" class="jump" aria-label="Choose a puzzle"></nav>
<p class="muted tip">Right-click a square to highlight it. Right-click and drag to draw an arrow. Hold Shift, Ctrl or Alt for other colors. Click the board to clear.</p>
</section>
</div>
<details class="history" id="history">
<summary>Timed history</summary>
<div id="historyContent"></div>
</details>
</main>

function saveAttempt(attempt) {
  run.attempts.push(attempt);
  try {
    if (storageAvailable) {
      const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
      history = saved.filter(entry => entry.id !== run.id);
    }
  } catch {
    storageAvailable = false;
  }
  history = [run, ...history.filter(entry => entry.id !== run.id)];
  try {
    if (storageAvailable) localStorage.setItem(storageKey, JSON.stringify(history));
  } catch {
    storageAvailable = false;

  renderHistory();

function renderHistory() {
  const content = get('historyContent');
  content.replaceChildren();
  const status = document.createElement('p');
  status.className = 'muted';
  status.textContent = storageAvailable
    ? (history.length ? 'Saved in this browser for this file.' : 'Your timed submissions will appear here.')
    : 'This browser blocked access to saved history. New submissions are available until you close this page.';
  content.append(status);
  for (const entry of history) {
    const detail = document.createElement('details');
    detail.className = 'history-run';
    const summary = document.createElement('summary');
    const score = entry.attempts.filter(attempt => attempt.correct).length;
    const sessionSection = sections[entry.section ?? 'setup'] ?? sections.setup;
    const total = sessionSection.puzzles.length;
    summary.textContent = new Date(entry.started).toLocaleString() + ` · ${sessionSection.title}` +
      ` · ${score}/${total} correct · ${entry.attempts.length}/${total} submitted`;
    detail.append(summary);
    const tableWrap = document.createElement('div');
    tableWrap.className = 'history-table';
    const table = document.createElement('table');
    const header = table.createTHead().insertRow();
    for (const heading of ['Puzzle', 'Submitted at', 'Time', 'Answer', 'Result']) {
      const cell = document.createElement('th');
      cell.scope = 'col';
      cell.textContent = heading;
      header.append(cell);
    }
    const body = table.createTBody();
    for (const attempt of entry.attempts) {
      const row = body.insertRow();
      for (const value of [attempt.puzzle, new Date(attempt.at).toLocaleString(),
        duration(attempt.elapsed), attempt.squares.join(', ') || '—', attempt.correct ? 'Correct' : (attempt.squares.length ? 'Missed' : 'Skipped')]) {
        row.insertCell().textContent = value;
      }
    }
    tableWrap.append(table);
    detail.append(tableWrap);
    content.append(detail);
  }
}

  const attempt = puzzle.attempts?.[reviewSquare];
  const line = puzzle.lines?.[lineIndex];
  const move = line?.[linePly - 1];
  const shown = {...(move?.board ?? puzzle.board)};
  const marks = isMovePuzzle() ? [move?.end ?? moveSource].filter(Boolean) : (reviewSquare ? [reviewSquare] : [...selected]);
  if (!isMovePuzzle()) {
    for (const square of marks) shown[square] = queen();
  }
  const reply = defenseShown ? attempt?.reply : null;
  if (reply) {
    const [from, to] = reply;
    shown[to] = shown[from];
    delete shown[from];
  }
  for (const [square, button] of Object.entries(buttons)) {
    const piece = shown[square];
    const upper = piece?.toUpperCase();
    const glyph = button.querySelector('.piece');
    drawPiece(glyph, piece);
    glyph.className = 'piece ' + (piece && piece === upper ? 'white-piece' : 'black-piece') + (pieceSets[pieceSet] ? ' art' : '');
    if (upper === 'Q') glyph.className += ' queen-piece';
    button.setAttribute('aria-label', piece ? `${square}, ${piece === upper ? 'white' : 'black'} ${names[upper]}` : square);
    button.setAttribute('aria-pressed', String(isMovePuzzle() ? square === moveSource : selected.has(square)));
    button.classList.toggle('placed', marks.includes(square));
    const accepted = puzzle.answers?.includes(square);
    button.classList.toggle('accepted', (checked && marks.includes(square) && accepted) || (revealed && accepted));
    button.classList.toggle('rejected', checked && !isMovePuzzle() && marks.includes(square) && !accepted);
    const protectedKnight = defenseShown && !isMovePuzzle() && index === 10 && reviewSquare === 'f5';
    button.classList.toggle('target', !defenseShown && !!attempt?.targets.includes(square));
    button.classList.toggle('reply', !!reply?.includes(square) || (protectedKnight && ['d2','f4'].includes(square)));
  }
  drawPiece(get('tray'), queen());
  get('tray').className = 'piece ' + (queen() === 'Q' ? 'white-piece' : 'black-piece') + (pieceSets[pieceSet] ? ' art' : '');
  get('tray').hidden = isMovePuzzle();
  get('defense').hidden = isMovePuzzle() || (!attempt?.reply && !(index === 10 && reviewSquare === 'f5'));
  get('playLine').hidden = !line;
  if (line) {
    get('playLine').textContent = linePly < line.length
      ? (linePly === 1 ? 'Show reply' : 'Show next move')
      : (puzzle.lines.length > 1 ? 'Next answer-key line' : 'Replay line');
  }
  get('defense').textContent = defenseShown ? 'Undo defense' : 'Show defense';
}

function feedback(message, correct = false) {
  get('feedback').textContent = message;
  get('feedback').classList.toggle('correct', correct);
}

function updateProgress() {
  const number = puzzleNumber(current(), index);
  const puzzleLabel = number === index + 1
    ? `Puzzle ${number} of ${puzzles.length}`
    : `Puzzle ${number} · ${index + 1} of ${puzzles.length} positions`;
  const score = run?.attempts.filter(attempt => attempt.correct).length;
  get('progress').textContent = run
    ? `${puzzleLabel} · ${score}/${run.attempts.length} correct so far`
    : `${puzzleLabel} · ${solved.size} solved`;
  get('next').disabled = Boolean(waitingForAnswer());
  get('next').textContent = run && index === puzzles.length - 1
    ? (completed ? 'New timed test' : 'Finish test') : 'Next puzzle';
  get('check').hidden = isMovePuzzle() && !run;
  get('check').disabled = checked || (!run && !selected.size);
  get('check').textContent = run && !selected.size ? 'Skip puzzle' : 'Check squares';
  get('answer').textContent = isMovePuzzle() ? 'Show first move' : 'Show answers';
  get('hint').hidden = Boolean(run);
  get('retry').hidden = Boolean(run);
  get('answer').hidden = Boolean(waitingForAnswer());
  get('jump').hidden = Boolean(run);
  for (const [i, button] of [...get('jump').children].entries()) {
    button.classList.toggle('done', solved.has(i));
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  }
}

function resetReview() {
  reviewSquare = '';
  defenseShown = false;
  get('review').hidden = true;
  get('reviewSquare').replaceChildren();
}

function place(square) {
  if (run && checked) return;
  if (isMovePuzzle()) {
    tryQueenMove(square);
    return;
  }
  if (!current().attempts[square]) {
    feedback('That square is occupied. Choose an empty square.');
    return;
  }
  if (selected.has(square)) selected.delete(square);
  else selected.add(square);
  checked = false;
  revealed = false;
  resetReview();
  feedback(selected.size ? `${selected.size} marked · ${[...selected].sort().join(', ')}` : 'The queen starts off the board.');
  renderBoard();
  updateProgress();
}

function checkSelection() {
  if (checked || (!run && !selected.size)) return;
  if (isMovePuzzle()) {
    submitMove('');
    return;
  }
  const elapsed = run ? performance.now() - startedAt : 0;
  const correctCount = current().answers.filter(square => selected.has(square)).length;
  const correct = correctCount === current().answers.length && correctCount === selected.size;
  checked = true;
  if (run) {
    saveAttempt({
      puzzle: index + 1, at: new Date().toISOString(), elapsed,
      squares: [...selected].sort(), correct
    });
  } else if (correct) {
    solved.add(index);
  }
  feedback((correct ? 'Correct. You found the full set.' :
    `${correctCount} right · ${selected.size - correctCount} incorrect · ${current().answers.length - correctCount} still missing.`) +
    (run ? ' Time ' + duration(elapsed) + '.' : ''), correct);
  const select = get('reviewSquare');
  for (const square of ['', ...[...selected].sort()]) {
    const option = document.createElement('option');
    option.value = square;
    option.textContent = square || 'All marked squares';
    select.append(option);
  }
  get('review').hidden = !selected.size;
  renderBoard();
  updateProgress();
}

function tryQueenMove(square) {
  const puzzle = current();
  if (lineIndex >= 0) return;
  if (square === puzzle.start) {
    moveSource = square;
    feedback('Choose the square to move your queen to.');
    renderBoard();
    return;
  }
  if (!moveSource) {
    feedback('Select your queen first.');
    return;
  }
  if (!puzzle.targets.includes(square)) {
    feedback('The queen cannot legally move to that square.');
    return;
  }
  submitMove(square);
}

function submitMove(square) {
  const puzzle = current();
  const elapsed = run ? performance.now() - startedAt : 0;
  const match = puzzle.lines.findIndex(line => line[0].end === square);
  const correct = match >= 0;
  checked = Boolean(run) || correct;
  moveSource = '';
  if (run) {
    saveAttempt({puzzle: puzzle.number, at: new Date().toISOString(), elapsed,
      squares: square ? [`${puzzle.start} to ${square}`] : [], correct});
  } else if (correct) {
    solved.add(index);
  }
  const time = run ? ' Time ' + duration(elapsed) + '.' : '';
  if (correct) showSolution(match, 'Correct.');
  else {
    feedback((square ? `Your queen move to ${square} differs from the workbook answer.` : 'Puzzle skipped.') +
      (run ? ' Use Show first move to review it.' : ' Try another square.') + time);
  }
  if (correct && run) get('feedback').textContent += time;
  renderBoard();
  updateProgress();
}

function showSolution(variation, lead = '') {
  lineIndex = variation;
  linePly = 1;
  feedback([lead, current().lines[variation][0].san].filter(Boolean).join(' '), lead === 'Correct.');
  renderBoard();
}

function renderJumps() {
  const jump = get('jump');
  jump.replaceChildren();
  puzzles.forEach((puzzle, i) => {
    const button = document.createElement('button');
    button.textContent = puzzleNumber(puzzle, i);
    button.setAttribute('aria-label', `Puzzle ${puzzleNumber(puzzle, i)}`);
    button.addEventListener('click', () => loadPuzzle(i));
    jump.append(button);
  });
}

function loadPuzzle(nextIndex) {
  index = nextIndex;
  clearAnnotations();
  selected.clear();
  moveSource = '';
  lineIndex = -1;
  linePly = 0;
  checked = false;
  revealed = false;
  resetReview();
  const color = current().side === 'W' ? 'white' : 'black';
  get('side').textContent = isMovePuzzle()
    ? `${color === 'white' ? 'White' : 'Black'} to move`
    : `Place the ${color} queen`;
  get('instructions').textContent = isMovePuzzle()
    ? 'Select your queen and play the first move of the double attack.'
    : 'Mark every square where a single queen would give check and threaten to win a piece. Click a marked square to remove it.';
  const section = sections[sectionId];
  get('workbookPage').textContent = `Workbook p. ${section.page} · Answer key p. 75` +
    (sectionId === 'queen-b' ? ' · No. 5 is an illustration' : '');
  const prompt = isMovePuzzle() ? 'Find the double attack.' : 'The queen starts off the board.';
  feedback(run ? 'Timer running. ' + prompt : prompt);
  renderBoard();
  updateProgress();
  if (run) startedAt = performance.now();
}

function startTest() {
  const started = new Date().toISOString();
  run = {id: started + '-' + Math.random().toString(36).slice(2), started, section: sectionId, attempts: []};
  completed = false;
  loadPuzzle(0);
}

for (let rank = 8; rank >= 1; rank--) {
  for (const [fileIndex, file] of [...'abcdefgh'].entries()) {
    const square = file + rank;
    const button = document.createElement('button');
    button.className = 'square ' + ((fileIndex + rank) % 2 === 0 ? 'light' : 'dark');
    button.dataset.square = square;
    if (fileIndex === 0) button.innerHTML += `<span class="coord rank" aria-hidden="true">${rank}</span>`;
    if (rank === 1) button.innerHTML += `<span class="coord file" aria-hidden="true">${file}</span>`;
    button.innerHTML += '<span class="piece" aria-hidden="true"></span>';
    button.addEventListener('click', () => place(square));
    buttons[square] = button;
    get('board').append(button);
  }
}

// Chess.com-style annotations: right-click highlights a square, right-drag draws an arrow.
const SVG_NS = 'http://www.w3.org/2000/svg';
const overlay = document.createElementNS(SVG_NS, 'svg');
overlay.setAttribute('class', 'annotations');
overlay.setAttribute('viewBox', '0 0 8 8');
overlay.setAttribute('aria-hidden', 'true');
get('board').append(overlay);
const arrowColors = {orange:'#ffaa00', green:'#9fcf3f', red:'#f8553f', blue:'#48c1f9'};
const highlights = new Map();
const arrows = new Map();
let drawFrom = '';
const center = square => [square.charCodeAt(0) - 96.5, 8.5 - Number(square[1])];
const squareAt = event => event.target.closest?.('.square')?.dataset.square || '';
const modifier = event => event.shiftKey ? 'shift' : event.ctrlKey ? 'ctrl' : event.altKey ? 'alt' : '';

function drawAnnotations() {
  for (const [square, button] of Object.entries(buttons)) {
    if (highlights.has(square)) button.dataset.hl = highlights.get(square);
    else delete button.dataset.hl;
  }
  overlay.replaceChildren();
  for (const [key, color] of arrows) {
    const [x1, y1] = center(key.slice(0, 2));
    const [x2, y2] = center(key.slice(2));
    const dx = x2 - x1, dy = y2 - y1;
    // Knight moves bend: travel the long leg first, then turn into the target.
    const knight = Math.abs(dx * dy) === 2;
    const corner = knight ? (Math.abs(dx) === 2 ? [x2, y1] : [x1, y2]) : [x1, y1];
    const lead = knight ? [corner[0] - x1, corner[1] - y1] : [dx, dy];
    const leadLength = Math.hypot(...lead);
    const start = [x1 + lead[0] / leadLength * 0.36, y1 + lead[1] / leadLength * 0.36];
    const last = [x2 - corner[0], y2 - corner[1]];
    const lastLength = Math.hypot(...last);
    const ux = last[0] / lastLength, uy = last[1] / lastLength;
    const base = [x2 - ux * 0.45, y2 - uy * 0.45];
    const group = document.createElementNS(SVG_NS, 'g');
    group.setAttribute('opacity', '0.8');
    const shaft = document.createElementNS(SVG_NS, 'polyline');
    const path = knight ? [start, corner, base] : [start, base];
    shaft.setAttribute('points', path.map(point => point.join(',')).join(' '));
    shaft.setAttribute('fill', 'none');
    shaft.setAttribute('stroke', arrowColors[color]);
    shaft.setAttribute('stroke-width', '0.275');
    shaft.setAttribute('stroke-linejoin', 'miter');
    const head = document.createElementNS(SVG_NS, 'polygon');
    head.setAttribute('points', [
      [base[0] - uy * 0.325, base[1] + ux * 0.325], [x2, y2], [base[0] + uy * 0.325, base[1] - ux * 0.325]
    ].map(point => point.join(',')).join(' '));
    head.setAttribute('fill', arrowColors[color]);
    group.append(shaft, head);
    overlay.append(group);
  }
}

function clearAnnotations() {
  if (!highlights.size && !arrows.size) return;
  highlights.clear();
  arrows.clear();
  drawAnnotations();
}

function toggle(map, key, color) {
  if (map.get(key) === color) map.delete(key);
  else map.set(key, color);
}

get('board').addEventListener('contextmenu', event => event.preventDefault());
get('board').addEventListener('mousedown', event => {
  if (event.button === 2) drawFrom = squareAt(event);
  else if (event.button === 0) clearAnnotations();
});
document.addEventListener('mouseup', event => {
  if (event.button !== 2 || !drawFrom) return;
  const from = drawFrom;
  const to = squareAt(event);
  drawFrom = '';
  if (!to) return;
  const key = modifier(event);
  if (to === from) toggle(highlights, to, {shift:'green', ctrl:'orange', alt:'blue'}[key] || 'red');
  else toggle(arrows, from + to, {shift:'green', ctrl:'red', alt:'blue'}[key] || 'orange');
  drawAnnotations();
});

get('section').onchange = event => {
  sectionId = event.target.value;
  puzzles = sections[sectionId].puzzles;
  solved.clear();
  renderJumps();
  if (run) startTest();
  else loadPuzzle(0);
};

get('hint').onclick = () => {
  if (isMovePuzzle()) {
    const first = current().lines[0][0];
    feedback(first.san.endsWith('+')
      ? 'Look for a queen check that also threatens a second target.'
      : 'Look for a queen move that creates two threats at once. A check is optional.');
    return;
  }
  const [king] = Object.entries(current().board).find(([, p]) => p.toLowerCase() === 'k');
  feedback(`Start at the king on ${king}. Trace the lines where a queen could give check, then look for a second target.`);
};
get('check').onclick = checkSelection;
get('reviewSquare').onchange = event => {
  reviewSquare = event.target.value;
  defenseShown = false;
  feedback(reviewSquare ? current().attempts[reviewSquare].message : 'Review any marked square or show all the answers.');
  renderBoard();
};
get('timed').onchange = event => {
  if (event.target.checked) startTest();
  else {
    run = null;
    loadPuzzle(index);
  }
};
get('retry').onclick = () => loadPuzzle(index);
get('next').onclick = () => {
  if (waitingForAnswer()) return;
  if (!run || index < puzzles.length - 1) loadPuzzle((index + 1) % puzzles.length);
  else if (completed) startTest();
  else {
    completed = true;
    const score = run.attempts.filter(attempt => attempt.correct).length;
    feedback(`Final score · ${score}/${puzzles.length} puzzles correct.`, score === puzzles.length);
    get('history').open = true;
    updateProgress();
  }
};
get('answer').onclick = () => {
  if (waitingForAnswer()) return;
  if (isMovePuzzle()) {
    moveSource = '';
    showSolution(0);
    return;
  }
  revealed = !revealed;
  defenseShown = false;
  feedback(revealed ? 'Accepted squares · ' + current().answers.join(', ') : 'Answers hidden.');
  renderBoard();
};
get('playLine').onclick = () => {
  const lines = current().lines;
  if (linePly < lines[lineIndex].length) {
    linePly += 1;
    feedback(lines[lineIndex].slice(0, linePly).map(move => move.san).join(' → '));
    renderBoard();
  } else {
    showSolution((lineIndex + 1) % lines.length);
  }
};
get('defense').onclick = () => {
  defenseShown = !defenseShown;
  const attempt = current().attempts[reviewSquare];
  if (!defenseShown || !attempt.reply) feedback(attempt.message);
  else {
    const [from, to] = attempt.reply;
    const piece = names[current().board[from].toUpperCase()];
    feedback(`The ${piece} moves from ${from} to ${to}. That blocks the check and saves the attacked piece from a profitable capture.`);
  }
  renderBoard();
};
const piecePicker = get('pieces');
try {
  const savedPieces = localStorage.getItem(pieceStorageKey);
  if (Array.from(piecePicker.options).some(option => option.value === savedPieces)) pieceSet = savedPieces;
} catch {
  // The default set is used if the browser blocks local storage.
}
piecePicker.value = pieceSet;
piecePicker.addEventListener('change', () => {
  pieceSet = piecePicker.value;
  try {
    localStorage.setItem(pieceStorageKey, pieceSet);
  } catch {
    // The choice remains active for this page.
  }
  renderBoard();
});
// Snap the board to whole device pixels. Squares that land on fractional pixels make piece edges look fuzzy.
const boardElement = get('board');
function snapBoard() {
  const ratio = window.devicePixelRatio || 1;
  boardElement.style.width = '';
  boardElement.style.margin = '';
  const available = boardElement.getBoundingClientRect().width;
  const squareSize = Math.floor(available / 8 * ratio) / ratio;
  boardElement.style.width = squareSize * 8 + 'px';
  const box = boardElement.getBoundingClientRect();
  const nudge = value => Math.round(value * ratio) / ratio - value;
  boardElement.style.margin = `${nudge(box.top + window.scrollY)}px 0 0 ${nudge(box.left + window.scrollX)}px`;
}
new ResizeObserver(snapBoard).observe(document.querySelector('.layout'));
window.addEventListener('resize', snapBoard);
snapBoard();
renderJumps();
loadPuzzle(0);
renderHistory();
</script>
</html>
